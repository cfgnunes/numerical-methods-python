name: CI

on:
  push:
  pull_request:


jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: numerical-methods
        environment-file: environment.yml

    - name: Test the project
      shell: bash -el {0}
      run: python3 main.py
